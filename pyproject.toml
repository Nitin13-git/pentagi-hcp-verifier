[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentagi-hcp-verifier"
version = "0.1.0"
description = "An HCP-conformant Verifier backed by PentAGI's public GraphQL API — independent evidence, no changes to PentAGI required."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nitin Kushwaha" }]
dependencies = [
    "hcp @ git+https://github.com/Nitin13-git/hcp.git",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pentagi_hcp_verifier"]

[tool.pytest.ini_options]
pythonpath = ["src"]
